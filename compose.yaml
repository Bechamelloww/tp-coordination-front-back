name: medislot-formation
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: medislot
      POSTGRES_USER: medislot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medislot-local-only}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medislot"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medislot
      DB_PASSWORD: ${DB_PASSWORD:-medislot-local-only}
      DEMO_SEED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Definir DEMO_PASSWORD dans .env (voir .env.example)}
      AB_ENABLED: "true"
      AB_MAX_PARTICIPANTS: "10"
      AB_TOKEN_SECRET: ${AB_TOKEN_SECRET:-medislot-ab-local-only-secret-change-me}
      # OpenTelemetry : l'agent est chargé par la JVM, sans toucher à la commande de lancement.
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: medislot-api
      # service.version = commit déployé (export GIT_SHA=$(git rev-parse --short HEAD)).
      OTEL_RESOURCE_ATTRIBUTES: service.version=${GIT_SHA:-local},deployment.environment.name=${OTEL_ENVIRONMENT:-formation}
      # Collecteur joint par son nom de service Docker ; l'agent envoie en OTLP/HTTP et ajoute /v1/traces.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      # Suivre la décision du navigateur (drapeau 01), tout garder pour une requête sans parent.
      OTEL_TRACES_SAMPLER: parentbased_always_on
      # Ni métriques ni journaux : pas de récepteur pour eux, on évite les erreurs d'envoi en boucle.
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      db: {condition: service_healthy}
      collector: {condition: service_started}
    ports: ["127.0.0.1:18080:8080"]
  frontend:
    build:
      context: ./frontend
      args: {GIT_SHA: "${GIT_SHA:-local}"}
    depends_on: [backend, collector]
    ports: ["127.0.0.1:8088:80"]
  # Reçoit les spans du navigateur (via Nginx /otlp/) et du back, les nettoie, les envoie à Jaeger.
  # Aucun port publié : seul le réseau Docker interne y accède.
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observabilite/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [jaeger]
  # Stockage et recherche des traces (en mémoire). Pas d'authentification : publié sur 127.0.0.1 seulement.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports: ["127.0.0.1:16686:16686"]
volumes:
  pgdata:

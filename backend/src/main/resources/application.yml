server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medislot}
    username: ${DB_USER:medislot}
    password: ${DB_PASSWORD:medislot-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
medislot:
  # Comptes de démo désactivés par défaut ; le mot de passe vient de DEMO_PASSWORD, jamais du code.
  demo-seed: ${DEMO_SEED:false}
  demo-password: ${DEMO_PASSWORD:}
  ab:
    enabled: ${AB_ENABLED:true}
    max-participants: ${AB_MAX_PARTICIPANTS:10}
    # Secret HMAC des jetons de variante (32 octets minimum). Valeur locale uniquement.
    token-secret: ${AB_TOKEN_SECRET:medislot-ab-local-only-secret-change-me}
    token-ttl: ${AB_TOKEN_TTL:PT24H}

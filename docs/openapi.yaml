                "schema": {
                  "$ref": "#/components/schemas/AbMetrics"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Professional": {
        "type": "object",
        "required": [
          "id",
          "name",
          "specialty",
          "city",
          "address",
          "bio",
          "fee"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "bio": {
            "type": "string"
          },
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "fee": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Slot": {
        "type": "object",
        "required": [
          "id",
          "professionalId",
          "startsAt",
          "endsAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "professionalId": {
            "type": "integer"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "BookingRequest": {
        "type": "object",
        "required": [
          "slotId"
        ],
        "properties": {
          "slotId": {
            "type": "integer",
            "minimum": 1
          },
          "reasonCode": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "FIRST_VISIT",
              "FOLLOW_UP",
              "PRESCRIPTION",
              "RESULTS",
              null
            ],
            "description": "Motif : code de liste, jamais de texte libre. Validé, non conservé."
          },
          "forWhom": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "SELF",
              "RELATIVE",
              null
            ]
          },
          "relativeName": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 120,
            "description": "Obligatoire si forWhom = RELATIVE."
          },
          "phone": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^0[1-9][0-9]{8}$"
          }
        }
      },
      "Appointment": {
        "type": "object",
        "required": [
          "id",
          "slotId",
          "professionalId",
          "professionalName",
          "status",
          "startsAt"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "slotId": {
            "type": "integer"
          },
          "professionalId": {
            "type": "integer"
          },
          "professionalName": {
            "type": "string"
          },
          "specialty": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "CONFIRMED",
              "CANCELLED"
            ]
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Identity": {
        "type": "object",
        "required": [
          "id",
          "name",
          "email",
          "role"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string"
          }
        }
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object"
            }
          }
        }
      },
      "Notification": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "message": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "History": {
        "type": "object",
        "properties": {
          "action": {
            "type": "string",
            "enum": [
              "CREATED",
              "RESCHEDULED",
              "CANCELLED"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "AbAssignment": {
        "type": "object",
        "required": [
          "experiment",
          "enabled",
          "participating",
          "token"
        ],
        "properties": {
          "experiment": {
            "type": "string",
            "examples": [
              "confirm_label_v1"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "participating": {
            "type": "boolean",
            "description": "false au-delà des N premiers patients ou si le test est désactivé"
          },
          "token": {
            "type": [
              "string",
              "null"
            ],
            "description": "JWT HS256 signé par le serveur. Charge : sub (id patient), experiment, variant (A|B), iat, exp. null hors expérience : afficher A."
          }
        }
      },
      "AbVariantMetrics": {
        "type": "object",
        "required": [
          "variant",
          "assigned",
          "exposed",
          "converted",
          "rate"
        ],
        "properties": {
          "variant": {
            "type": "string",
            "enum": [
              "A",
              "B"
            ]
          },
          "assigned": {
            "type": "integer",
            "minimum": 0
          },
          "exposed": {
            "type": "integer",
            "minimum": 0
          },
          "converted": {
            "type": "integer",
            "minimum": 0,
            "description": "Patients exposés ayant réservé (une fois par patient)"
          },
          "rate": {
            "type": [
              "number",
              "null"
            ],
            "description": "converted / exposed, null si exposed = 0"
          }
        }
      },
      "AbMetrics": {
        "type": "object",
        "required": [
          "experiment",
          "enabled",
          "maxParticipants",
          "participants",
          "variants"
        ],
        "properties": {
          "experiment": {
            "type": "string"
          },
          "enabled": {
            "type": "boolean"
          },
          "maxParticipants": {
            "type": "integer"
          },
          "participants": {
            "type": "integer"
          },
          "variants": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AbVariantMetrics"
            }
          }
        }
      },
      "SlotTaken": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Problem"
          }
        ],
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "const": "SLOT_TAKEN"
          },
          "professionalId": {
            "type": "integer",
            "description": "Pour proposer d’autres créneaux du même praticien"
          }
        }
      }
    },
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "JSESSIONID"
      }
    }
  }
}

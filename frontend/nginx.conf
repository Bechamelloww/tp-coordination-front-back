limit_req_zone $binary_remote_addr zone=connexion:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=inscription:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=flux:1m;
limit_req_zone $binary_remote_addr zone=traces:1m rate=5r/s;
limit_req_status 429;

server {
 listen 80;
 root /usr/share/nginx/html;
 location / {
  try_files $uri $uri/ /index.html;
  add_header Content-Security-Policy "script-src 'self'; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
 }
 location = /actuator/health { proxy_pass http://backend:8080; }
 location = /api/login {
  limit_req zone=connexion burst=10 nodelay;
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
 }
 location = /api/register {
  limit_req zone=inscription burst=5 nodelay;
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
 }
 location = /api/events {
  limit_conn flux 10;
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
 # Traces du navigateur : même origine que la page (aucun réglage CORS), relayées au collecteur interne.
 # La barre finale de proxy_pass retire le préfixe : /otlp/v1/traces -> collector:4318/v1/traces.
 location /otlp/ {
  limit_except POST { deny all; }
  limit_req zone=traces burst=20 nodelay;
  proxy_pass http://collector:4318/;
  client_max_body_size 1m;
 }
}

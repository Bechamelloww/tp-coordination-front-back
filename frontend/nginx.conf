server {
 listen 80;
 root /usr/share/nginx/html;
 location / { try_files $uri $uri/ /index.html; }
 location = /actuator/health { proxy_pass http://backend:8080; }
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
 # Traces du navigateur : même origine que la page (aucun réglage CORS), relayées au collecteur interne.
 # La barre finale de proxy_pass retire le préfixe : /otlp/v1/traces -> collector:4318/v1/traces.
 location /otlp/ {
  proxy_pass http://collector:4318/;
  client_max_body_size 1m;
 }
}
